name: android-release

# Builds the Holistic Health Connect companion APK.
#
#   • workflow_dispatch or a v* tag push
#   • With signing secrets configured → signed release APK attached to a
#     GitHub Release (use that asset URL for NEXT_PUBLIC_COMPANION_APK_URL).
#   • Without secrets → debug-signed APK as a workflow artifact (installable
#     for testing).
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Create the base64 locally:  base64 -w0 holistic-release.jks

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Configure release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/holistic-release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/holistic-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signing config written."
          else
            echo "No keystore secret set — building a debug-signed APK."
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/apk/holistic-companion-${GITHUB_REF_NAME:-manual}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: holistic-companion-apk
          path: apk/*.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
